events {}

http {
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ----------------------------------REACT----------------------------------
    server {

        listen 443 ssl;
        server_name react.domain;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {

#          proxy_pass http://host.docker.internal:5173;
         proxy_pass http://react-client:5173;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

        }
    }

    # ----------------------------------BROWSER BFFs----------------------------------
    server {
        listen 443 ssl;
        server_name bff.domain;

        client_max_body_size 15M;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location /browser/ {

            limit_req zone=auth_limit burst=12 nodelay;

            proxy_pass http://browser-bff:3000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /android/ {

            limit_req zone=auth_limit burst=12 nodelay;

            proxy_pass http://android-bff:3001/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

#     ----------------------------------KEYCLOAK----------------------------------
    server {
        listen 443 ssl;
        server_name keycloak.domain;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://keycloak:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

# ----------------------------------MINIO----------------------------------
    server {
        listen 443 ssl;
        server_name minio.domain;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        location / {
            proxy_pass http://webstore-minio:9000;

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}