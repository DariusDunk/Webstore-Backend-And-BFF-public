spring.application.name=APPLICATION_NAME
spring.datasource.url = DATASOURCE_URL
spring.datasource.username = DATASOURCE_USERNAME
spring.datasource.password = DATASOURCE_PASSWORD
spring.data.jpa.properties.hibernate.dialect=HIBERNATE_DIALECT
spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = none
spring.jpa.hibernate.naming.implicit-strategy = org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
spring.jpa.properties.hibernate.format_sql=true
server.port=1620

# 1. Identity Validation (External)
spring.security.oauth2.client.provider.keycloak.issuer-uri=ISSUER_URI

# 2. Browser Redirect: Where the user's browser is sent to type in their password (External)
spring.security.oauth2.client.provider.keycloak.authorization-uri=AUTHORIZATION_URI

# 3. Backend Communication: Where Spring gets tokens and user data behind the scenes (Internal)
spring.security.oauth2.client.provider.keycloak.token-uri=TOKEN_URI
spring.security.oauth2.client.provider.keycloak.user-info-uri=USER_INFO_URI
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=JWK_SET_URI

spring.security.oauth2.client.registration.keycloak.client-id=CLIENT_ID
spring.security.oauth2.client.registration.keycloak.client-secret=CLIENT_SECRET
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=REDIRECT_URI


keycloak.server-url=KEYCLOAK_SERVER_URL
keycloak.admin-realm=ADMIN_REALM
keycloak.admin.client-id=ADMIN_CLIENT_ID
keycloak.admin-username=ADMIN_USERNAME
keycloak.admin-password=ADMIN_PASSWORD
keycloak.user-realm=USER_REALM
keycloak.token-target-address=TOKEN_TARGET_ADDRESS
keycloak.ream.name = REALM_NAME
keycloak.regular-client-id=REGULAR_CLIENT_ID

spring.mail.host=MAIL_HOST
spring.mail.port=1025

logging.level.org.apache.fontbox=ERROR
logging.level.com.openhtmltopdf=ERROR
logging.level.com.openhtmltopdf.load=ERROR
logging.level.com.openhtmltopdf.match=ERROR
logging.level.com.openhtmltopdf.general=ERROR
#---------------------------------------------------

tensorflow.serving.grpc-port=8500
tensorflow.serving.grpc-address=GRPC_ADDRESS
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#---------------------------------------------------

minio.url=http://webstore-minio:9000
minio.access-key=ACCESS_KEY
minio.secret-key=SECRET_KEY
minio.productsBucket=PRODUCTS_BUCKET

